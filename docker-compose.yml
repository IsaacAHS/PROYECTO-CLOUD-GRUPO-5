services:
  web-ui:
    build:
      context: ./apps/web-ui
    container_name: nimbuscore-web-ui
    ports:
      - "8081:80"

  slice-manager:
    build:
      context: ./apps/slice-manager
    container_name: nimbuscore-slice-manager
    environment:
      NIMBUSCORE_JOB_DIR: /jobs
      NIMBUSCORE_KEYPAIR_DIR: /keypairs
      NIMBUSCORE_IMAGE_CATALOG_PATH: /data/images.json
      NIMBUSCORE_SLICE_STORE_PATH: /data/slices.json
      NIMBUSCORE_DEPLOYMENT_STORE_PATH: /data/deployments.json
      NIMBUSCORE_SLICE_TEMPLATE_STORE_PATH: /data/slice_templates.json
      NIMBUSCORE_ACADEMIC_STORE_PATH: /data/academic.json
      NIMBUSCORE_VM_INVENTORY_PATH: /script-runs/vm_inventory.json
      NIMBUSCORE_NOVNC_TOKEN_FILE: /novnc-tokens/tokens.cfg
      NIMBUSCORE_NOVNC_PUBLIC_BASE: /novnc
      NIMBUSCORE_IMAGE_UPLOAD_DIR: /image-uploads
      NIMBUSCORE_IMAGE_UPLOAD_SCRIPT: /image-runner/upload_image_to_drive.sh
      NIMBUSCORE_RCLONE_REMOTE: "${NIMBUSCORE_RCLONE_REMOTE:-}"
      NIMBUSCORE_RCLONE_FOLDER: "${NIMBUSCORE_RCLONE_FOLDER:-NimbusCore/images}"
      RCLONE_CONFIG: /root/.config/rclone/rclone.conf
    ports:
      - "8000:8000"
    volumes:
      - nimbuscore_jobs:/jobs
      - ${NIMBUSCORE_KEYPAIR_DIR:-/home/ubuntu/nimbuscore-keys}:/keypairs
      - ./data/json-store:/data
      - ./runtime/script-runs:/script-runs:ro
      - nimbuscore_novnc_tokens:/novnc-tokens
      - ./services/image-manager/uploads:/image-uploads
      - ./services/image-manager/runner:/image-runner:ro
      - ${NIMBUSCORE_RCLONE_CONFIG_DIR:-/home/ubuntu/.config/rclone}:/root/.config/rclone

  linux-driver:
    build:
      context: ./drivers/linux/worker
    container_name: nimbuscore-linux-driver
    environment:
      NIMBUSCORE_JOB_DIR: /jobs
      NIMBUSCORE_RUN_DIR: /script-runs
      NIMBUSCORE_VM_INVENTORY_PATH: /script-runs/vm_inventory.json
      NIMBUSCORE_SCRIPT_DRY_RUN: "false"
      NIMBUSCORE_HEADNODE_IP: "${NIMBUSCORE_HEADNODE_IP:-10.0.10.5}"
      NIMBUSCORE_COMPUTE_IPS: "${NIMBUSCORE_COMPUTE_IPS:-10.0.10.1,10.0.10.2,10.0.10.3,10.0.10.4}"
      NIMBUSCORE_REMOTE_SCRIPTS_DIR: /home/ubuntu/script_runner
      NIMBUSCORE_KEYPAIR_DIR: "${NIMBUSCORE_KEYPAIR_DIR:-/home/ubuntu/nimbuscore-keys}"
      NIMBUSCORE_OVS_UPLINKS: "${NIMBUSCORE_OVS_UPLINKS:-ens4}"
      NIMBUSCORE_SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      NIMBUSCORE_CONSOLE_USER: "${NIMBUSCORE_CONSOLE_USER:-nimbus}"
      NIMBUSCORE_CONSOLE_PASSWORD: "${NIMBUSCORE_CONSOLE_PASSWORD:-NimbusCore123}"
      NIMBUSCORE_ENABLE_PASSWORD_LOGIN: "${NIMBUSCORE_ENABLE_PASSWORD_LOGIN:-true}"
      NIMBUSCORE_ENABLE_AUTO_ROUTING: "${NIMBUSCORE_ENABLE_AUTO_ROUTING:-false}"
      NIMBUSCORE_ENABLE_MGMT_NETWORK: "${NIMBUSCORE_ENABLE_MGMT_NETWORK:-true}"
      NIMBUSCORE_MGMT_VLAN: "${NIMBUSCORE_MGMT_VLAN:-99}"
      NIMBUSCORE_MGMT_CIDR: "${NIMBUSCORE_MGMT_CIDR:-10.60.9.0/24}"
      NIMBUSCORE_MGMT_GATEWAY: "${NIMBUSCORE_MGMT_GATEWAY:-10.60.9.1}"
      NIMBUSCORE_MGMT_DNS: "${NIMBUSCORE_MGMT_DNS:-8.8.8.8}"
      NIMBUSCORE_MGMT_DHCP_SERVER_IP: "${NIMBUSCORE_MGMT_DHCP_SERVER_IP:-10.60.9.2}"
      NIMBUSCORE_MGMT_DHCP_START: "${NIMBUSCORE_MGMT_DHCP_START:-10.60.9.20}"
      NIMBUSCORE_MGMT_DHCP_END: "${NIMBUSCORE_MGMT_DHCP_END:-10.60.9.250}"
      NIMBUSCORE_MGMT_DHCP_LEASE_TIME: "${NIMBUSCORE_MGMT_DHCP_LEASE_TIME:-12h}"
      NIMBUSCORE_VLAN_BASE: "${NIMBUSCORE_VLAN_BASE:-100}"
      NIMBUSCORE_VLAN_BLOCK_SIZE: "${NIMBUSCORE_VLAN_BLOCK_SIZE:-100}"
      NIMBUSCORE_VNC_BASE: "${NIMBUSCORE_VNC_BASE:-5901}"
      NIMBUSCORE_VNC_BLOCK_SIZE: "${NIMBUSCORE_VNC_BLOCK_SIZE:-100}"
      NIMBUSCORE_CIDR_BASE: "${NIMBUSCORE_CIDR_BASE:-10}"
      NIMBUSCORE_CIDR_BLOCK_SIZE: "${NIMBUSCORE_CIDR_BLOCK_SIZE:-20}"
    depends_on:
      - slice-manager
    volumes:
      - nimbuscore_jobs:/jobs
      - ./runtime/script-runs:/script-runs
      - ${NIMBUSCORE_SSH_DIR:-/home/ubuntu/.ssh}:/root/.ssh:ro

  console-access:
    build:
      context: ./apps/console-access
    container_name: nimbuscore-console-access
    volumes:
      - nimbuscore_novnc_tokens:/tokens
    expose:
      - "6080"

  api-gateway:
    image: nginx:1.27-alpine
    container_name: nimbuscore-api-gateway
    depends_on:
      - web-ui
      - slice-manager
      - console-access
    ports:
      - "8080:80"
    volumes:
      - ./apps/api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  nimbuscore_jobs:
  nimbuscore_novnc_tokens:
