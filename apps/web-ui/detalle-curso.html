		.sidebar-section-label {

			text-transform: uppercase;

		.sidebar-nav li a {

		.sidebar-nav li a i { width: 1.25em; text-align: center; font-size: 0.95em; color: #9fa3a6; transition: color 0.2s; }
		.sidebar-nav li a:hover { color: #3d4449; background: rgba(245,106,106,0.05); border-left-color: rgba(245,106,106,0.4); }

				<div class="section-header-left">

				</div>

					<button type="button" class="btn-bulk-deploy" id="bulkDeployBtn" onclick="deployAllSlices()" title="Desplegar todos los slices del curso">

<script>
const params    = new URLSearchParams(window.location.search);
const courseId  = params.get('id')     || 'TEL000';
const courseNom = decodeURIComponent(params.get('nombre') || 'Curso');

document.title = `Slices — ${courseNom}`;
document.getElementById('bc-curso').textContent   = courseNom;
document.getElementById('badge-id').textContent   = courseId;
document.getElementById('page-title').textContent = `Slices — ${courseNom}`;
document.getElementById('col-slices').textContent = `Slices — ${courseNom}`;

document.getElementById('assignSliceBtn').href = 'slices.html';

let slices = [];
let bulkActionRunning = false;

function fmt(s) {
	const h = Math.floor(s / 3600);
	const m = Math.floor((s % 3600) / 60);
	const sec = s % 60;
	return [h, m, sec].map(n => String(n).padStart(2, '0')).join(':');
}

function stateFromBackend(estado) {
	const normalized = String(estado || '').toUpperCase();
	if (normalized === 'ACTIVO') return 'running';
	if (normalized === 'DESPLEGANDO' || normalized === 'DESTRUYENDO') return 'busy';
	if (normalized === 'ERROR') return 'error';
	return 'off';
}

function stateLabel(slice) {
	const estado = String(slice.backendEstado || '').toUpperCase();
	if (estado === 'ACTIVO') return 'Activo';
	if (estado === 'DESPLEGANDO') return 'Desplegando';
	if (estado === 'DESTRUYENDO') return 'Destruyendo';
	if (estado === 'DESTRUIDO') return 'Destruido';
	if (estado === 'ERROR') return 'Error';
	if (estado === 'ASIGNADO') return 'Asignado';
	return estado ? estado.charAt(0) + estado.slice(1).toLowerCase() : 'Pendiente';
}

function resolvedBackendEstado(slice) {
	const estado = String(slice.estado || 'ASIGNADO').toUpperCase();
	const runtimeStatus = String(
		slice.runtime_status || (slice.vm_inventory && slice.vm_inventory.status) || ''
	).toUpperCase();

	if (runtimeStatus === 'FAILED') return 'ERROR';
	if (runtimeStatus === 'DESTROYED') return 'DESTRUIDO';
	if (runtimeStatus === 'DESTROYING') return 'DESTRUYENDO';
	if (runtimeStatus === 'SUCCESS' && estado === 'DESPLEGANDO') return 'ACTIVO';
	if (runtimeStatus === 'RUNNING' && estado !== 'DESTRUYENDO') return 'DESPLEGANDO';
	return estado;
}

async function loadCourseSlices() {
	try {
		const response = await fetch('/api/slices');
		if (!response.ok) throw new Error(`API respondio ${response.status}`);
		const apiSlices = await response.json();
		return apiSlices
			.filter(slice => String(slice.curso_id || '') === String(courseId))
			.map((slice, index) => {
				const backendEstado = resolvedBackendEstado(slice);
				return {
					id: slice.id,
					name: slice.nombre,
					alumno: slice.alumno_nombre || '',
					backendEstado,
					state: stateFromBackend(backendEstado),
					hasInventory: !!(slice.vm_inventory && (slice.vm_inventory.vms || []).length),
					secs: 0,
					isAssigned: true,
					index,
				};
			});
	} catch (error) {
		console.warn('Backend no disponible, usando asignaciones locales.', error);
		const assignments = JSON.parse(localStorage.getItem('nimbuscore_assignments') || '[]');
		return assignments
			.filter(a => a.courseId === courseId)
			.map((a, i) => ({
				id: 'a' + i,
				name: a.sliceName,
				alumno: a.studentName || '',
				backendEstado: 'LOCAL',
				state: 'off',
				hasInventory: false,
				secs: 0,
				isAssigned: true,
			}));
	}
}

async function renderTable() {
	slices = await loadCourseSlices();
	const tbody = document.getElementById('slices-tbody');
	const bulkDeployBtn = document.getElementById('bulkDeployBtn');
	const bulkDestroyBtn = document.getElementById('bulkDestroyBtn');
	const assignSliceBtn = document.getElementById('assignSliceBtn');
	const deployableCount = slices.filter(s => s.state !== 'running' && s.state !== 'busy').length;
	const activeCount = slices.filter(s => s.state === 'running').length;
	if (bulkDeployBtn) bulkDeployBtn.disabled = bulkActionRunning || deployableCount === 0;
	if (bulkDestroyBtn) bulkDestroyBtn.disabled = bulkActionRunning || activeCount === 0;
	if (assignSliceBtn) assignSliceBtn.hidden = slices.length > 0;
	if (!slices.length) {
		tbody.innerHTML = `
			<tr>
				<td colspan="4" style="text-align:center;padding:3em 1.5em;color:#9fa3a6">
					<i class="fas fa-layer-group" style="display:block;font-size:2.4em;margin-bottom:0.5em;color:rgba(210,215,217,0.85)"></i>
					Este curso todavía no tiene slices asignados.
				</td>
			</tr>`;
		return;
	}
	tbody.innerHTML = slices.map(s => {
		const deployDisabled = bulkActionRunning || s.state === 'running' || s.state === 'busy';
		const destroyDisabled = bulkActionRunning || s.state === 'off' || s.state === 'busy';
		return `
		<tr id="tr-${s.id}">
			<td>
				<span class="status-dot ${s.state}" id="dot-${s.id}"></span>
				<span class="slice-name">${s.name}</span>
				${s.alumno ? `<span style="font-size:0.78em;color:#9fa3a6;margin-left:0.75em">${s.alumno}</span>` : ''}
			</td>
			<td>
				<span class="timer ${s.state === 'busy' ? 'busy' : s.state === 'error' ? 'error' : s.state === 'off' ? 'off' : ''}"
				      id="status-${s.id}">${stateLabel(s)}</span>
			</td>
			<td class="col-center">
				<div class="ctrl-btns">
					<button class="btn-ctrl btn-deploy ${s.state === 'running' ? 'on' : ''}"
					        onclick="deploySlice('${s.id}')" title="Desplegar o encender VMs" ${deployDisabled ? 'disabled' : ''}>
						<i class="fas fa-play"></i>
						Desplegar
					</button>
					<button class="btn-ctrl btn-destroy ${s.state === 'off' ? 'on' : ''}"
					        onclick="destroySlice('${s.id}')" title="Apagar y destruir VMs" ${destroyDisabled ? 'disabled' : ''}>
						<i class="fas fa-power-off"></i>
						Apagar
					</button>
				</div>
			</td>
			<td class="col-center">
				<a href="ver-slice.html?slice=${s.id}&curso=${encodeURIComponent(courseId)}&nombre=${encodeURIComponent(courseNom)}"
				   class="btn-action btn-view" title="Ver slice">
					<i class="fas fa-eye"></i>
				</a>
			</td>
		</tr>
	`;
	}).join('');
}

function findSlice(id) {
	return slices.find(x => String(x.id) === String(id));
}

function setSlicePending(id, label) {
	const s = findSlice(id);
	if (!s) return;
	s.state = 'busy';
	s.backendEstado = label;
	const row = document.getElementById('tr-' + id);
	if (!row) return;
	row.querySelectorAll('.btn-ctrl').forEach(btn => { btn.disabled = true; });
	const dot = document.getElementById('dot-' + id);
	dot.className = `status-dot ${s.state}`;
	const status = document.getElementById('status-' + id);
	status.className = 'timer busy';
	status.textContent = label === 'DESTRUYENDO' ? 'Destruyendo' : 'Desplegando';
}

function setBulkActionState(running, action, label) {
	bulkActionRunning = running;
	const deployButton = document.getElementById('bulkDeployBtn');
	const destroyButton = document.getElementById('bulkDestroyBtn');

	if (deployButton) {
		deployButton.disabled = running;
		deployButton.innerHTML = running && action === 'deploy'
			? `<i class="fas fa-spinner fa-spin"></i> ${label}`
			: '<i class="fas fa-play-circle"></i> Desplegar todos';
	}

	if (destroyButton) {
		destroyButton.disabled = running;
		destroyButton.innerHTML = running && action === 'destroy'
			? `<i class="fas fa-spinner fa-spin"></i> ${label}`
			: '<i class="fas fa-power-off"></i> Apagar todos';
	}
}

async function requestSliceJob(id, action) {
	const response = await fetch(`/api/slices/${encodeURIComponent(id)}/${action}`, { method: 'POST' });
	if (!response.ok) {
		let detail = `API respondio ${response.status}`;
		try {
			const payload = await response.json();
			detail = payload.detail || detail;
		} catch (_) {}
		throw new Error(detail);
	}
	return response.json();
}

async function pollDeployment(jobId, options = {}) {
	const renderOnChange = options.render !== false;
	for (let attempt = 0; attempt < 120; attempt++) {
		await new Promise(resolve => setTimeout(resolve, 2500));
		const response = await fetch(`/api/deployments/${encodeURIComponent(jobId)}`);
		if (!response.ok) continue;
		const deployment = await response.json();
		if (deployment.status === 'SUCCESS') {
			if (renderOnChange) await renderTable();
			return deployment;
		}
		if (deployment.status === 'FAILED') {
			if (renderOnChange) await renderTable();
			throw new Error(deployment.message || 'El job fallo');
		}
	}
	if (renderOnChange) await renderTable();
	throw new Error('El job sigue en ejecucion. Revisa los logs del worker.');
}

async function deploySlice(id) {
	try {
		if (bulkActionRunning) return;
		setSlicePending(id, 'DESPLEGANDO');
		const deployment = await requestSliceJob(id, 'deploy');
		await pollDeployment(deployment.id);
	} catch (error) {
		console.error('No se pudo desplegar el slice.', error);
		alert(`No se pudo desplegar el slice: ${error.message}`);
		await renderTable();
	}
}

async function deployAllSlices() {
	if (bulkActionRunning) return;

	const pendingSlices = slices.filter(s => s.state !== 'running' && s.state !== 'busy');
	if (!pendingSlices.length) return;

	const queuedDeployments = [];
	try {
		setBulkActionState(true, 'deploy', `Encolando 1/${pendingSlices.length}`);
		await renderTable();

		for (let index = 0; index < pendingSlices.length; index++) {
			const slice = pendingSlices[index];
			setBulkActionState(true, 'deploy', `Encolando ${index + 1}/${pendingSlices.length}`);
			setSlicePending(slice.id, 'DESPLEGANDO');
			const deployment = await requestSliceJob(slice.id, 'deploy');
			queuedDeployments.push({ slice, deployment });
		}

		let completed = 0;
		setBulkActionState(true, 'deploy', `Desplegando 0/${queuedDeployments.length}`);
		await renderTable();

		const results = await Promise.allSettled(queuedDeployments.map(async ({ deployment }) => {
			const result = await pollDeployment(deployment.id, { render: false });
			completed += 1;
			setBulkActionState(true, 'deploy', `Desplegando ${completed}/${queuedDeployments.length}`);
			await renderTable();
			return result;
		}));
		const failed = results.filter(result => result.status === 'rejected');
		if (failed.length) {
			throw new Error(`${failed.length} job(s) de despliegue fallaron.`);
		}
	} catch (error) {
		console.error('No se pudo completar el despliegue masivo.', error);
		alert(`No se pudo completar el despliegue masivo: ${error.message}`);
		await renderTable();
	} finally {
		setBulkActionState(false);
		await renderTable();
	}
}

async function destroySlice(id) {
	const s = findSlice(id);
	if (!s) return;
	if (bulkActionRunning) return;
	if (!confirm(`Se apagaran y eliminaran las VMs de "${s.name}". ¿Continuar?`)) return;
	try {
		setSlicePending(id, 'DESTRUYENDO');
		const deployment = await requestSliceJob(id, 'destroy');
		await pollDeployment(deployment.id);
	} catch (error) {
		console.error('No se pudo apagar el slice.', error);
		alert(`No se pudo apagar el slice: ${error.message}`);
		await renderTable();
	}
}

async function destroyAllSlices() {
	if (bulkActionRunning) return;

	const activeSlices = slices.filter(s => s.state === 'running');
	if (!activeSlices.length) return;
	if (!confirm(`Se apagaran y eliminaran las VMs de ${activeSlices.length} slice(s) activo(s). ¿Continuar?`)) return;

	try {
		setBulkActionState(true, 'destroy', `Apagando 1/${activeSlices.length}`);
		await renderTable();

		for (let index = 0; index < activeSlices.length; index++) {
			const slice = activeSlices[index];
			setBulkActionState(true, 'destroy', `Apagando ${index + 1}/${activeSlices.length}`);
			setSlicePending(slice.id, 'DESTRUYENDO');
			const deployment = await requestSliceJob(slice.id, 'destroy');
			await pollDeployment(deployment.id);
		}

		await renderTable();
	} catch (error) {
		console.error('No se pudo completar el apagado masivo.', error);
		alert(`No se pudo completar el apagado masivo: ${error.message}`);
		await renderTable();
	} finally {
		setBulkActionState(false);
		await renderTable();
	}
}

function tick() {
	slices.forEach(s => {
		if (s.state !== 'running' || s.secs <= 0) return;
		s.secs--;
		const el = document.getElementById('timer-' + s.id);
		if (el) el.textContent = fmt(s.secs);
	});
}

(function() {
	const sidebar = document.getElementById('sidebar');
	const toggle = document.getElementById('sidebarToggle');
	const backdrop = document.getElementById('sidebarBackdrop');
	const mobileQuery = window.matchMedia('(max-width: 1024px)');

	function setSidebarOpen(open) {
		sidebar.classList.toggle('collapsed', !open);
		backdrop.classList.toggle('visible', mobileQuery.matches && open);
	}

	function closeMobileSidebar() {
		if (mobileQuery.matches) setSidebarOpen(false);
	}

	function syncSidebar() {
		if (mobileQuery.matches) {
			setSidebarOpen(false);
			return;
		}
		sidebar.classList.toggle('collapsed', localStorage.getItem('sidebarCollapsed') === 'true');
		backdrop.classList.remove('visible');
	}

	syncSidebar();
	toggle.addEventListener('click', () => {
		const shouldOpen = sidebar.classList.contains('collapsed');
		setSidebarOpen(shouldOpen);
		if (!mobileQuery.matches) {
			localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
		}
	});
	backdrop.addEventListener('click', closeMobileSidebar);
	document.addEventListener('keydown', e => {
		if (e.key === 'Escape') closeMobileSidebar();
	});

	if (mobileQuery.addEventListener) mobileQuery.addEventListener('change', syncSidebar);
	else mobileQuery.addListener(syncSidebar);
})();

renderTable();
setInterval(tick, 1000);
</script>
