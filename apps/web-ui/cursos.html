<!DOCTYPE HTML>
<html lang="es">
<head>
	<title>Cursos</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet" />
	<style>

		*, *::before, *::after { box-sizing: border-box; }

		html, body {
			height: 100%;
			margin: 0; padding: 0;
			overflow: hidden;
			background-color: #f5f6f7;
			font-family: 'Open Sans', sans-serif;
			color: #7f888f;
			font-size: 13pt;
			line-height: 1.65;
		}

		.app-layout { display: flex; height: 100vh; overflow: hidden; }

		/* ══ SIDEBAR ══ */
		#sidebar {
			width: 260px;
			min-width: 260px;
			background: #ffffff;
			border-right: solid 1px rgba(210, 215, 217, 0.75);
			display: flex;
			flex-direction: column;
			height: 100vh;
			overflow-y: auto;
			overflow-x: hidden;
			flex-shrink: 0;
			transition: width 0.28s ease, min-width 0.28s ease, border-color 0.28s ease;
		}

		#sidebar.collapsed {
			width: 0;
			min-width: 0;
			border-right-color: transparent;
			overflow: hidden;
		}

		.sidebar-backdrop { display: none; }

		.sidebar-brand { padding: 2em 1.75em 1.5em; border-bottom: solid 4px #f56a6a; white-space: nowrap; }

		.sidebar-brand h1 {
			font-family: 'Roboto Slab', serif;
			font-weight: 700;
			font-size: 1.1em;
			color: #3d4449;
			text-transform: uppercase;
			letter-spacing: 0.075em;
			margin: 0 0 0.2em 0;
			line-height: 1.3;
		}

		.sidebar-brand span { font-family: 'Open Sans', sans-serif; font-size: 0.75em; color: #9fa3a6; display: block; }

		.sidebar-section-label {
			font-family: 'Roboto Slab', serif;
			font-size: 0.65em;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: #9fa3a6;
			padding: 1.5em 1.75em 0.5em;
			white-space: nowrap;
		}

		.sidebar-nav { list-style: none; margin: 0; padding: 0 0 1em 0; flex: 1; }

		.sidebar-nav li a {
			display: flex;
			align-items: center;
			gap: 0.75em;
			padding: 0.75em 1.75em;
			font-family: 'Open Sans', sans-serif;
			font-size: 0.9em;
			font-weight: 600;
			color: #7f888f;
			text-decoration: none;
			border-left: solid 3px transparent;
			white-space: nowrap;
			transition: color 0.2s, background 0.2s, border-color 0.2s;
		}

		.sidebar-nav li a i { width: 1.25em; text-align: center; font-size: 0.95em; color: #9fa3a6; transition: color 0.2s; }
		.sidebar-nav li a:hover { color: #3d4449; background: rgba(245,106,106,0.05); border-left-color: rgba(245,106,106,0.4); }
		.sidebar-nav li a:hover i { color: #f56a6a; }
		.sidebar-nav li.active a { color: #f56a6a; background: rgba(245,106,106,0.07); border-left-color: #f56a6a; }
		.sidebar-nav li.active a i { color: #f56a6a; }

		.sidebar-footer {
			padding: 1.25em 1.75em;
			border-top: solid 1px rgba(210, 215, 217, 0.75);
			font-size: 0.75em;
			color: #9fa3a6;
			font-family: 'Open Sans', sans-serif;
			white-space: nowrap;
		}

		/* ══ MAIN CONTENT ══ */
		.main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

		.topbar {
			background: #ffffff;
			border-bottom: solid 1px rgba(210, 215, 217, 0.75);
			padding: 0.9em 1.75em;
			display: flex;
			align-items: center;
			gap: 0.75em;
			flex-shrink: 0;
		}

		.btn-sidebar-toggle {
			width: 2.2em; height: 2.2em;
			border-radius: 0.35em;
			border: solid 1px rgba(210,215,217,0.75);
			background: transparent;
			color: #7f888f;
			display: flex; align-items: center; justify-content: center;
			cursor: pointer;
			flex-shrink: 0;
			transition: background 0.2s, color 0.2s;
		}
		.btn-sidebar-toggle:hover { background: rgba(245,106,106,0.07); color: #f56a6a; }

		.topbar-title {
			font-family: 'Roboto Slab', serif;
			font-weight: 700;
			font-size: 1.1em;
			color: #3d4449;
			text-transform: uppercase;
			letter-spacing: 0.075em;
			margin: 0;
			flex: 1;
		}

		.topbar-user { font-size: 0.82em; color: #9fa3a6; font-family: 'Open Sans', sans-serif; white-space: nowrap; }
		.topbar-user i { color: #f56a6a; margin-right: 0.4em; }

		.page-body { padding: 2.5em; flex: 1; overflow-y: auto; }

		.section-header {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			margin-bottom: 1.75em;
			flex-wrap: wrap;
			gap: 1em;
		}

		.section-header-left h2 {
			font-family: 'Roboto Slab', serif;
			font-weight: 700;
			font-size: 1.5em;
			color: #3d4449;
			margin: 0 0 0.2em 0;
			letter-spacing: 0.03em;
		}

		.section-header-left p { margin: 0; font-size: 0.88em; color: #9fa3a6; }

		.btn-crear {
			display: inline-flex;
			align-items: center;
			gap: 0.5em;
			height: 3.5em;
			padding: 0 2em;
			background: #f56a6a;
			color: #ffffff;
			border: none;
			border-radius: 0.375em;
			font-family: 'Roboto Slab', serif;
			font-size: 0.78em;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.075em;
			cursor: pointer;
			text-decoration: none;
			transition: background 0.2s;
			white-space: nowrap;
		}
		.btn-crear:hover { background: #f67878; color: #ffffff; }
		.btn-crear:active { background: #f45c5c; }

		.table-card {
			background: #ffffff;
			border: solid 1px rgba(210, 215, 217, 0.75);
			border-radius: 0.375em;
			overflow: hidden;
		}

		.cursos-table {
			width: 100%;
			border-collapse: collapse;
			font-family: 'Open Sans', sans-serif;
			font-size: 0.9em;
		}

		.cursos-table thead tr { background: #f5f6f7; border-bottom: solid 2px rgba(210,215,217,0.75); }

		.cursos-table thead th {
			font-family: 'Roboto Slab', serif;
			font-weight: 700;
			font-size: 0.78em;
			text-transform: uppercase;
			letter-spacing: 0.075em;
			color: #3d4449;
			padding: 1em 1.5em;
			text-align: left;
			white-space: nowrap;
		}

		.cursos-table thead th.col-action { text-align: center; width: 100px; }

		.cursos-table tbody tr {
			border-bottom: solid 1px rgba(210,215,217,0.5);
			transition: background 0.15s;
		}
		.cursos-table tbody tr:last-child { border-bottom: none; }
		.cursos-table tbody tr:hover { background: rgba(245,106,106,0.03); }

		.cursos-table tbody td { padding: 1.1em 1.5em; color: #7f888f; vertical-align: middle; }

		.curso-code {
			display: inline-block;
			background: rgba(245,106,106,0.1);
			color: #f56a6a;
			font-family: 'Roboto Slab', serif;
			font-size: 0.75em;
			font-weight: 700;
			padding: 0.25em 0.65em;
			border-radius: 0.25em;
			margin-right: 0.75em;
			white-space: nowrap;
			letter-spacing: 0.04em;
		}

		.curso-nombre { color: #3d4449; font-weight: 600; text-decoration: none; transition: color 0.2s; }
		.curso-nombre:hover { color: #f56a6a; }

		.cursos-table td.col-action { text-align: center; }

		.btn-action {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 2.4em; height: 2.4em;
			border-radius: 0.375em;
			border: solid 1px rgba(210,215,217,0.75);
			background: transparent;
			cursor: pointer;
			transition: background 0.2s, border-color 0.2s, color 0.2s;
			text-decoration: none;
		}
		.btn-action i { font-size: 0.85em; }

		.btn-edit { color: #7f888f; }
		.btn-edit:hover { background: rgba(61,68,73,0.06); border-color: #3d4449; color: #3d4449; }

		.btn-delete { color: #9fa3a6; }
		.btn-delete:hover { background: rgba(245,106,106,0.08); border-color: #f56a6a; color: #f56a6a; }

		@media (max-width: 900px) { .page-body { padding: 1.5em; } }
		@media (max-width: 1024px) {
			.app-layout { height: 100vh; overflow: hidden; }
			#sidebar {
				position: fixed;
				inset: 3.95em auto 0 0;
				z-index: 1000;
				width: 260px;
				min-width: 260px;
				max-width: 85vw;
				height: calc(100vh - 3.95em);
				transform: translateX(0);
				box-shadow: 0.5rem 0 1.5rem rgba(0,0,0,0.16);
				transition: transform 0.28s ease, border-color 0.28s ease;
			}
			#sidebar.collapsed {
				width: 260px;
				min-width: 260px;
				transform: translateX(-100%);
				border-right-color: transparent;
				box-shadow: none;
			}
			.sidebar-backdrop {
				display: block;
				position: fixed;
				inset: 3.95em 0 0 0;
				z-index: 999;
				background: rgba(61,68,73,0.35);
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.28s ease;
			}
			.sidebar-backdrop.visible {
				opacity: 1;
				pointer-events: auto;
			}
			.main-content { width: 100%; height: 100vh; overflow: hidden; }
			.page-body { overflow: auto; padding: 1.25em; }
			.topbar { position: relative; z-index: 1001; padding: 1em 1.5em; }
			.cursos-table thead th, .cursos-table tbody td { padding: 0.9em 1em; }
		}

	</style>
</head>
<body>

<div class="app-layout">

	<!-- SIDEBAR -->
	<aside class="sidebar" id="sidebar">
		<div class="sidebar-brand">
			<h1>Cloud Group 5</h1>
			<span>Panel de administración</span>
		</div>

		<div class="sidebar-section-label">Menú principal</div>

		<ul class="sidebar-nav">
			<li class="active">
				<a href="cursos.html">
					<i class="fas fa-book-open"></i>
					Cursos
				</a>
			</li>
			<li>
				<a href="slices.html">
					<i class="fas fa-layer-group"></i>
					Slices
				</a>
			</li>
			<li>
				<a href="dashboards.html">
					<i class="fas fa-chart-bar"></i>
					Dashboards
				</a>
			</li>
			<li>
				<a href="#">
					<i class="fas fa-users-cog"></i>
					Gestión de usuarios
				</a>
			</li>
		</ul>

		<div class="sidebar-footer">
			&copy; 2026 NimbusCore
		</div>
	</aside>

	<div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

	<!-- CONTENIDO PRINCIPAL -->
	<div class="main-content">

		<header class="topbar">
			<button class="btn-sidebar-toggle" id="sidebarToggle" title="Mostrar / ocultar menú">
				<i class="fas fa-bars"></i>
			</button>
			<h2 class="topbar-title">Cursos</h2>
			<span class="topbar-user">
				<i class="fas fa-user-circle"></i>
				Administrador
			</span>
		</header>

		<div class="page-body">

			<div class="section-header">
				<div class="section-header-left">
					<h2>Listado de Cursos</h2>
					<p>Por ahora existen 2 cursos base, cada uno con 3 alumnos persistidos en JSON.</p>
				</div>
				<a href="#" class="btn-crear" style="pointer-events:none;opacity:0.55">
					<i class="fas fa-lock"></i>
					Creación pendiente
				</a>
			</div>

			<div class="table-card">
				<table class="cursos-table">
					<thead>
						<tr>
							<th>Curso</th>
							<th class="col-action">Editar</th>
							<th class="col-action">Eliminar</th>
						</tr>
					</thead>
					<tbody id="cursos-tbody"></tbody>
				</table>
			</div>

		</div>
	</div>

</div>

<script>
const FALLBACK_COURSES = [
	{
		id: 'TEL141',
		nombre: 'Ingeniería de Redes Cloud',
		alumnos: [
			{ id: 'TEL141-A01', nombre: 'Ana Torres' },
			{ id: 'TEL141-A02', nombre: 'Bruno Díaz' },
			{ id: 'TEL141-A03', nombre: 'Carla Rojas' },
		],
	},
	{
		id: 'TEL142',
		nombre: 'Comunicaciones Móviles',
		alumnos: [
			{ id: 'TEL142-A01', nombre: 'Diego Vargas' },
			{ id: 'TEL142-A02', nombre: 'Elena Ramos' },
			{ id: 'TEL142-A03', nombre: 'Fernando Silva' },
		],
	},
];

async function loadCourses() {
	try {
		const response = await fetch('/api/cursos');
		if (!response.ok) throw new Error(`API respondio ${response.status}`);
		return response.json();
	} catch (error) {
		console.warn('Backend no disponible, usando cursos base.', error);
		return FALLBACK_COURSES;
	}
}

async function renderCourses() {
	const courses = await loadCourses();
	const tbody = document.getElementById('cursos-tbody');
	tbody.innerHTML = courses.map(course => `
		<tr>
			<td>
				<span class="curso-code">${course.id}</span>
				<a href="detalle-curso.html?id=${encodeURIComponent(course.id)}&nombre=${encodeURIComponent(course.nombre)}" class="curso-nombre">${course.nombre}</a>
				<span style="font-size:0.78em;color:#9fa3a6;margin-left:0.75em">${(course.alumnos || []).length} alumnos</span>
			</td>
			<td class="col-action">
				<span class="btn-action btn-edit" title="Edición de cursos pendiente"><i class="fas fa-lock"></i></span>
			</td>
			<td class="col-action">
				<span class="btn-action btn-delete" title="Eliminación de cursos pendiente"><i class="fas fa-lock"></i></span>
			</td>
		</tr>
	`).join('');
}

(function() {
	const sidebar = document.getElementById('sidebar');
	const toggle = document.getElementById('sidebarToggle');
	const backdrop = document.getElementById('sidebarBackdrop');
	const mobileQuery = window.matchMedia('(max-width: 1024px)');

	function setSidebarOpen(open) {
		sidebar.classList.toggle('collapsed', !open);
		backdrop.classList.toggle('visible', mobileQuery.matches && open);
	}

	function closeMobileSidebar() {
		if (mobileQuery.matches) setSidebarOpen(false);
	}

	function syncSidebar() {
		if (mobileQuery.matches) {
			setSidebarOpen(false);
			return;
		}
		sidebar.classList.toggle('collapsed', localStorage.getItem('sidebarCollapsed') === 'true');
		backdrop.classList.remove('visible');
	}

	syncSidebar();
	toggle.addEventListener('click', () => {
		const shouldOpen = sidebar.classList.contains('collapsed');
		setSidebarOpen(shouldOpen);
		if (!mobileQuery.matches) {
			localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
		}
	});
	backdrop.addEventListener('click', closeMobileSidebar);
	document.addEventListener('keydown', e => {
		if (e.key === 'Escape') closeMobileSidebar();
	});

	if (mobileQuery.addEventListener) mobileQuery.addEventListener('change', syncSidebar);
	else mobileQuery.addListener(syncSidebar);
})();

renderCourses();
</script>

</body>
</html>
