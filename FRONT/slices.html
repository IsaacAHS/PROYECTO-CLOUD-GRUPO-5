<!DOCTYPE HTML>
<html lang="es">
<head>
	<title>Slices</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet" />
	<style>

		*, *::before, *::after { box-sizing: border-box; }

		html, body {
			height: 100%;
			margin: 0; padding: 0;
			overflow: hidden;
			background-color: #f5f6f7;
			font-family: 'Open Sans', sans-serif;
			color: #7f888f;
			font-size: 13pt;
			line-height: 1.65;
		}

		.app-layout { display: flex; height: 100vh; overflow: hidden; }

		/* ══ SIDEBAR ══ */
		#sidebar {
			width: 260px;
			min-width: 260px;
			background: #fff;
			border-right: solid 1px rgba(210,215,217,0.75);
			display: flex;
			flex-direction: column;
			height: 100vh;
			overflow-y: auto;
			overflow-x: hidden;
			flex-shrink: 0;
			transition: width 0.28s ease, min-width 0.28s ease, border-color 0.28s ease;
		}

		#sidebar.collapsed {
			width: 0;
			min-width: 0;
			border-right-color: transparent;
			overflow: hidden;
		}

		.sidebar-brand { padding: 2em 1.75em 1.5em; border-bottom: solid 4px #f56a6a; white-space: nowrap; }

		.sidebar-brand h1 {
			font-family: 'Roboto Slab', serif;
			font-weight: 700;
			font-size: 1.1em;
			color: #3d4449;
			text-transform: uppercase;
			letter-spacing: 0.075em;
			margin: 0 0 0.2em;
		}

		.sidebar-brand span { font-size: 0.75em; color: #9fa3a6; display: block; }

		.sidebar-section-label {
			font-family: 'Roboto Slab', serif;
			font-size: 0.65em;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: #9fa3a6;
			padding: 1.5em 1.75em 0.5em;
			white-space: nowrap;
		}

		.sidebar-nav { list-style: none; margin: 0; padding: 0 0 1em; flex: 1; }

		.sidebar-nav li a {
			display: flex;
			align-items: center;
			gap: 0.75em;
			padding: 0.75em 1.75em;
			font-size: 0.9em;
			font-weight: 600;
			color: #7f888f;
			text-decoration: none;
			border-left: solid 3px transparent;
			white-space: nowrap;
			transition: color 0.2s, background 0.2s, border-color 0.2s;
		}

		.sidebar-nav li a i { width: 1.25em; text-align: center; font-size: 0.95em; color: #9fa3a6; transition: color 0.2s; }
		.sidebar-nav li a:hover { color: #3d4449; background: rgba(245,106,106,0.05); border-left-color: rgba(245,106,106,0.4); }
		.sidebar-nav li a:hover i { color: #f56a6a; }
		.sidebar-nav li.active a { color: #f56a6a; background: rgba(245,106,106,0.07); border-left-color: #f56a6a; }
		.sidebar-nav li.active a i { color: #f56a6a; }

		.sidebar-footer { padding: 1.25em 1.75em; border-top: solid 1px rgba(210,215,217,0.75); font-size: 0.75em; color: #9fa3a6; white-space: nowrap; }

		/* ══ MAIN CONTENT ══ */
		.main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

		.topbar {
			background: #fff;
			border-bottom: solid 1px rgba(210,215,217,0.75);
			padding: 0.9em 1.75em;
			display: flex;
			align-items: center;
			gap: 0.75em;
			flex-shrink: 0;
		}

		.btn-sidebar-toggle {
			width: 2.2em; height: 2.2em;
			border-radius: 0.35em;
			border: solid 1px rgba(210,215,217,0.75);
			background: transparent;
			color: #7f888f;
			display: flex; align-items: center; justify-content: center;
			cursor: pointer;
			flex-shrink: 0;
			transition: background 0.2s, color 0.2s;
		}
		.btn-sidebar-toggle:hover { background: rgba(245,106,106,0.07); color: #f56a6a; }

		.topbar-title {
			font-family: 'Roboto Slab', serif;
			font-weight: 700;
			font-size: 1.1em;
			color: #3d4449;
			text-transform: uppercase;
			letter-spacing: 0.075em;
			margin: 0;
			flex: 1;
		}

		.topbar-user { font-size: 0.82em; color: #9fa3a6; white-space: nowrap; }
		.topbar-user i { color: #f56a6a; margin-right: 0.4em; }

		.page-body { padding: 2.5em; flex: 1; overflow-y: auto; }

		.section-header {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			margin-bottom: 1.75em;
			flex-wrap: wrap;
			gap: 1em;
		}

		.section-header-left h2 {
			font-family: 'Roboto Slab', serif;
			font-weight: 700;
			font-size: 1.5em;
			color: #3d4449;
			margin: 0 0 0.2em;
			letter-spacing: 0.03em;
		}

		.section-header-left p { margin: 0; font-size: 0.88em; color: #9fa3a6; }

		.btn-crear {
			display: inline-flex;
			align-items: center;
			gap: 0.5em;
			height: 3.5em;
			padding: 0 2em;
			background: #f56a6a;
			color: #fff;
			border: none;
			border-radius: 0.375em;
			font-family: 'Roboto Slab', serif;
			font-size: 0.78em;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.075em;
			cursor: pointer;
			text-decoration: none;
			transition: background 0.2s;
			white-space: nowrap;
		}
		.btn-crear:hover { background: #f67878; color: #fff; }
		.btn-crear:active { background: #f45c5c; }

		.table-card {
			background: #fff;
			border: solid 1px rgba(210,215,217,0.75);
			border-radius: 0.375em;
			overflow: hidden;
		}

		.slices-table {
			width: 100%;
			border-collapse: collapse;
			font-family: 'Open Sans', sans-serif;
			font-size: 0.9em;
		}

		.slices-table thead tr { background: #f5f6f7; border-bottom: solid 2px rgba(210,215,217,0.75); }

		.slices-table thead th {
			font-family: 'Roboto Slab', serif;
			font-weight: 700;
			font-size: 0.78em;
			text-transform: uppercase;
			letter-spacing: 0.075em;
			color: #3d4449;
			padding: 1em 1.5em;
			text-align: left;
			white-space: nowrap;
		}

		.slices-table thead th.col-center { text-align: center; width: 100px; }

		.slices-table tbody tr {
			border-bottom: solid 1px rgba(210,215,217,0.5);
			transition: background 0.15s;
		}
		.slices-table tbody tr:last-child { border-bottom: none; }
		.slices-table tbody tr:hover { background: rgba(245,106,106,0.03); }

		.slices-table tbody td { padding: 1.05em 1.5em; color: #7f888f; vertical-align: middle; }
		.slices-table tbody td.col-center { text-align: center; }

		.slice-name { font-weight: 600; color: #3d4449; }

		.badge-unassigned {
			display: inline-block;
			background: rgba(74,159,213,0.1);
			color: #4a9fd5;
			font-family: 'Roboto Slab', serif;
			font-size: 0.68em;
			font-weight: 700;
			padding: 0.18em 0.55em;
			border-radius: 0.25em;
			letter-spacing: 0.04em;
			margin-left: 0.6em;
		}

		.btn-action {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 2.4em; height: 2.4em;
			border-radius: 0.375em;
			border: solid 1px rgba(210,215,217,0.75);
			background: transparent;
			cursor: pointer;
			text-decoration: none;
			transition: background 0.2s, border-color 0.2s, color 0.2s;
		}
		.btn-action i { font-size: 0.85em; }

		.btn-edit { color: #7f888f; }
		.btn-edit:hover { background: rgba(61,68,73,0.06); border-color: #3d4449; color: #3d4449; }

		.table-empty {
			text-align: center;
			padding: 3.5em 1.5em;
			color: #9fa3a6;
			font-size: 0.88em;
		}
		.table-empty i { display: block; font-size: 2.8em; margin-bottom: 0.5em; color: rgba(210,215,217,0.85); }

		@media (max-width: 900px) { .page-body { padding: 1.5em; } }
		@media (max-width: 680px) {
			.app-layout { flex-direction: column; height: auto; overflow: auto; }
			.sidebar { width: 100% !important; min-width: unset !important; height: auto; overflow: visible; }
			.main-content { overflow: visible; }
			.page-body { overflow: auto; padding: 1.25em; }
			.topbar { padding: 1em 1.5em; }
		}

	</style>
</head>
<body>

<div class="app-layout">

	<!-- SIDEBAR -->
	<aside class="sidebar" id="sidebar">
		<div class="sidebar-brand">
			<h1>Cloud Group 5</h1>
			<span>Panel de administración</span>
		</div>
		<div class="sidebar-section-label">Menú principal</div>
		<ul class="sidebar-nav">
			<li>
				<a href="cursos.html"><i class="fas fa-book-open"></i> Cursos</a>
			</li>
			<li class="active">
				<a href="slices.html"><i class="fas fa-layer-group"></i> Slices</a>
			</li>
			<li>
				<a href="#"><i class="fas fa-chart-bar"></i> Dashboards</a>
			</li>
			<li>
				<a href="#"><i class="fas fa-users-cog"></i> Gestión de usuarios</a>
			</li>
		</ul>
		<div class="sidebar-footer">&copy; 2026 Cloud Grupo 5</div>
	</aside>

	<!-- CONTENIDO PRINCIPAL -->
	<div class="main-content">

		<header class="topbar">
			<button class="btn-sidebar-toggle" id="sidebarToggle" title="Mostrar / ocultar menú">
				<i class="fas fa-bars"></i>
			</button>
			<h2 class="topbar-title">Slices</h2>
			<span class="topbar-user">
				<i class="fas fa-user-circle"></i>
				Administrador
			</span>
		</header>

		<div class="page-body">

			<div class="section-header">
				<div class="section-header-left">
					<h2>Slices sin asignar</h2>
					<p>Slices creados y guardados que aún no han sido asignados a un curso.</p>
				</div>
				<a href="configurar-slice.html" class="btn-crear">
					<i class="fas fa-plus"></i>
					Crear Nuevo Slice
				</a>
			</div>

			<div class="table-card">
				<table class="slices-table">
					<thead>
						<tr>
							<th>Nombre del Slice</th>
							<th class="col-center">Editar</th>
						</tr>
					</thead>
					<tbody id="slices-tbody"></tbody>
				</table>
			</div>

		</div>
	</div>

</div>

<script>
const SLICES_DEMO = [
	{ id: '1', nombre: 'Slice de Red A' },
	{ id: '2', nombre: 'Slice de Red B' },
	{ id: '3', nombre: 'Topología Árbol Lab 1' },
	{ id: '4', nombre: 'Topología Lineal Demo' },
];

function getUnassigned() {
	const assignments = JSON.parse(localStorage.getItem('cloud5_assignments') || '[]');
	const assignedIds = new Set(assignments.map(a => String(a.sliceId)));
	const userSlices  = JSON.parse(localStorage.getItem('cloud5_slices') || '[]');
	return [...SLICES_DEMO, ...userSlices].filter(s => !assignedIds.has(String(s.id)));
}

function renderTable() {
	const unassigned = getUnassigned();
	const tbody = document.getElementById('slices-tbody');
	if (!unassigned.length) {
		tbody.innerHTML = `
			<tr>
				<td colspan="2" class="table-empty">
					<i class="fas fa-layer-group"></i>
					No hay slices sin asignar.<br>Crea uno nuevo para comenzar.
				</td>
			</tr>`;
		return;
	}
	tbody.innerHTML = unassigned.map(s => `
		<tr>
			<td>
				<span class="slice-name">${s.nombre}</span>
				<span class="badge-unassigned">Sin asignar</span>
			</td>
			<td class="col-center">
				<a href="configurar-slice.html?slice=${s.id}&slicenombre=${encodeURIComponent(s.nombre)}" class="btn-action btn-edit" title="Editar slice">
					<i class="fas fa-pencil-alt"></i>
				</a>
			</td>
		</tr>
	`).join('');
}

(function() {
	const sidebar = document.getElementById('sidebar');
	if (localStorage.getItem('sidebarCollapsed') === 'true') sidebar.classList.add('collapsed');
	document.getElementById('sidebarToggle').addEventListener('click', () => {
		sidebar.classList.toggle('collapsed');
		localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
	});
})();

renderTable();
</script>

</body>
</html>
